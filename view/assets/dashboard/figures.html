<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figures · 图件核验</title>
  <style>
    :root{--ink:#20231d;--muted:#6f7469;--line:#d8ceb9;--green:#1f6b55;--red:#934225;--paper:#fffdf7;--shadow:0 18px 46px rgba(58,45,25,.14)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 16% 0,#f8e9be 0 22%,transparent 38%),linear-gradient(135deg,#eef0dc,#faf4e7 48%,#e7dec9);font-family:Georgia,"Times New Roman",serif;height:100vh;overflow:hidden}
    button,select{font:inherit}.nav{height:58px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,250,240,.94);border-bottom:1px solid var(--line)}
    .nav-title{font-weight:700;font-size:18px}.nav-center{flex:1;text-align:center}.project-select{min-width:280px;max-width:520px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 12px}.nav-right{display:flex;gap:7px;flex-wrap:wrap}.nav a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--paper);font-size:14px}.nav a.active{background:var(--green);border-color:var(--green);color:white}
    .app{height:calc(100vh - 58px);display:grid;grid-template-columns:330px minmax(560px,1fr) 390px;gap:14px;padding:14px}.panel{background:rgba(255,250,240,.95);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:0;display:flex;flex-direction:column}.head,.tabs{padding:14px;border-bottom:1px solid var(--line)}h1,h2,h3{margin:0;letter-spacing:-.02em}h1{font-size:22px}h2{font-size:18px}.sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.35}
    .list,.main,.side{overflow:auto;min-height:0}.list{padding:9px}.card{width:100%;text-align:left;border:1px solid transparent;background:var(--paper);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer;color:var(--ink)}.card:hover,.card.active{border-color:var(--green);background:#f2faf0}.title{font-weight:700;font-size:14px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.35}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:999px;background:#e4efe4;color:#285a37;margin:5px 4px 0 0}.warn{background:#f8dfd2;color:var(--red)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:7px 10px;cursor:pointer}.tab.active{background:var(--green);color:white;border-color:var(--green)}
    .main{background:var(--paper);padding:20px 24px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid var(--line);border-radius:14px;background:#fffaf0;padding:12px;min-height:160px}.box img{max-width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:white}.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);background:#fffaf0}.field{margin-bottom:13px}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.value{white-space:pre-wrap;line-height:1.45}.side{padding:14px}pre{white-space:pre-wrap;margin:0;font-family:Consolas,monospace;font-size:12px}.kv{display:grid;grid-template-columns:125px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.kv div:nth-child(odd){color:var(--muted);font-size:12px}
    @media(max-width:1100px){body{height:auto;overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{min-height:360px}.grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/assets/dashboard/review-ui.css">
</head>
<body>
  <nav class="nav"><div class="nav-title">Review Writer</div><div class="nav-center"><select id="projectSelect" class="project-select"></select></div><div class="nav-right" aria-hidden="true"></div></nav>
  <main id="canonical-source-figures" class="app">
    <section class="panel"><div class="head"><h1>原论文图件</h1><div id="projectInfo" class="sub">正在读取当前项目…</div></div><div id="figureList" class="list" aria-live="polite"></div></section>
    <section class="panel"><div class="head"><h2 id="mainTitle">来源图核验</h2><div id="mainMeta" class="sub"></div></div><div class="tabs"><button class="tab active" data-tab="figure">来源图</button><button class="tab" data-tab="attribution">来源与归属</button><button class="tab" data-tab="diagnostic">技术详情</button></div><div id="main" class="main"></div></section>
    <section class="panel"><div class="head"><h2>核验状态</h2><div class="sub">Figure Mode 由 Agent 生成候选；此处只核对真实来源、定位、归属与正文绑定。</div></div><div id="summary" class="side"></div></section>
  </main>
  <script src="/assets/dashboard/review-ui.js"></script>
  <script>
    let projects=[],payload={route:'unavailable',source_figures:[],placeholders:[]},selectedProject='',selected=0,tab=({"#license":"attribution","#binding":"figure","#attribution":"attribution"}[window.location.hash.toLowerCase()]||'figure');
    const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const read=(id,suffix,fallback)=>fetch(`/api/project/${encodeURIComponent(id)}/${suffix}`).then(response=>response.ok?response.json():fallback).catch(()=>fallback);
    const figures=()=>Array.isArray(payload?.source_figures)?payload.source_figures:[];
    const humanStatus=value=>window.ReviewPresentation?.humanStatus?.(value)||String(value||'待核对').replaceAll('_',' ');
    function image(path,label){return path?`<a href="${esc(path)}" target="_blank" rel="noopener"><img alt="${esc(label)}" src="${esc(path)}"></a>`:'<div class="empty">原图未提供。</div>'}
    async function loadProjects(){projects=await(await fetch('/api/projects')).json();$('projectSelect').innerHTML=projects.map(p=>`<option value="${esc(p.project_id)}">${esc(p.project_id)}</option>`).join('');const requested=window.ReviewPresentation?.projectIdFromLocation?.();const selectedProjectId=projects.find(p=>p.project_id===requested)?.project_id||projects[0]?.project_id;if(selectedProjectId){$('projectSelect').value=selectedProjectId;window.ReviewPresentation?.setProjectIdInLocation?.(selectedProjectId);await loadProject(selectedProjectId)}}
    async function loadProject(id){selectedProject=id;const state=await read(id,'review-state',{});payload=state.route==='evidence-to-release.v1'?await read(id,'review-figures',{route:state.route,status:'unavailable',source_figures:[],placeholders:[]}):{route:state.route||'legacy',status:'unavailable',source_figures:[],placeholders:[]};selected=0;render()}
    function renderList(){const rows=figures();$('figureList').innerHTML=rows.map((item,index)=>`<button class="card ${index===selected?'active':''}" data-idx="${index}"><div class="title">${esc(item.figure_label||item.caption||item.figure_id||`原论文图 ${index+1}`)}</div><div class="meta">${esc([item.study_id,item.source_id,item.page&&`第 ${item.page} 页`].filter(Boolean).join(' · ')||'定位未提供')}</div><span class="pill">${esc(humanStatus(item.selection_status||payload.status))}</span><span class="pill ${item.target_binding_status==='missing'?'warn':''}">${esc(item.target_binding_status==='missing'?'正文绑定缺失':'正文已绑定')}</span></button>`).join('')||'<div class="empty">当前项目没有 canonical 原论文图件记录。</div>'}
    function targetBindingControl(item){const options=Array.isArray(item.target_options)?item.target_options:[];if(item.target_binding_status==='current')return '<p>当前图件已绑定到 canonical 正文目标。</p>';if(!options.length)return '<p>目标选项未提供；不会伪造绑定成功。</p>';return `<label class="field"><div class="label">正文目标</div><select id="figure-target-binding">${options.map((option,index)=>`<option value="${index}">${esc(`${option.heading||option.section_id} · ${option.marker}`)}</option>`).join('')}</select></label><button id="save-figure-target-binding" type="button">绑定正文目标</button><p id="figure-target-binding-status" class="sub" role="status"></p>`}
    async function saveTargetBinding(){const item=figures()[selected]||{},select=$('figure-target-binding'),status=$('figure-target-binding-status'),options=Array.isArray(item.target_options)?item.target_options:[],option=options[Number(select?.value)];if(!selectedProject||!item.figure_id||!option||!item.asset_sha256||!payload?.manuscript?.sha256){if(status)status.textContent='当前图件没有可用的正文目标绑定。';return}const response=await fetch(`/api/project/${encodeURIComponent(selectedProject)}/review-figures`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({figure_id:item.figure_id,selection_status:'selected',version_token:item.version_token,target_binding:{figure_id:item.figure_id,asset_sha256:item.asset_sha256,manuscript_sha256:payload.manuscript.sha256,section_id:option.section_id,marker:option.marker,occurrence:option.occurrence}})});if(!response.ok){if(status)status.textContent=`绑定失败（HTTP ${response.status}）。请重新读取当前项目后再试。`;return}payload=await response.json();render()}
    function renderMain(){const item=figures()[selected]||{};$('mainTitle').textContent=item.figure_label||item.caption||'来源图核验';$('mainMeta').textContent=[item.study_id,item.source_id,item.page&&`第 ${item.page} 页`].filter(Boolean).join(' · ')||'来源定位未提供';if(tab==='figure'){$('main').innerHTML=`<div class="grid"><div class="box"><h3>原论文图</h3>${image(item.image_url,item.caption||item.figure_label||'原论文图')}</div><div class="box"><h3>正文绑定</h3><p>${esc(item.target_binding_status==='missing'?'尚未绑定到正文目标；不会伪造绑定成功。':'已提供正文目标绑定。')}</p>${targetBindingControl(item)}</div></div>`}else if(tab==='attribution'){$('main').innerHTML=`<div class="kv"><div>来源署名</div><div>${esc(item.attribution||'未提供')}</div><div>研究 / 来源</div><div>${esc([item.study_id,item.source_id].filter(Boolean).join(' · ')||'未提供')}</div><div>PDF 页</div><div>${esc(item.page?`第 ${item.page} 页`:'未提供')}</div><div>Evidence</div><div>${esc((item.evidence_ids||[]).join('、')||'未提供')}</div><div>复用权利</div><div>${esc(item.rights_context?.notice||item.rights_context?.status||'未提供')}</div><div>当前性</div><div>${esc(payload.status==='current'?'当前投影':'当前性未提供')}</div></div>`}else{$('main').innerHTML=`<details class="technical-details"><summary>技术详情</summary><pre>${esc(JSON.stringify(item,null,2))}</pre></details>`}}
    function renderSummary(){const rows=figures(),missingBinding=rows.filter(item=>item.target_binding_status==='missing').length,missingAttribution=rows.filter(item=>!item.attribution).length; $('projectInfo').textContent=`${selectedProject} · ${humanStatus(payload.status)}`;$('summary').innerHTML=`<div class="field"><div class="label">当前状态</div><div class="value">${esc(humanStatus(payload.status))}</div></div><div class="field"><div class="label">原论文图件</div><div class="value">${rows.length}</div></div><div class="field"><div class="label">正文绑定缺失</div><div class="value">${missingBinding}</div></div><div class="field"><div class="label">来源署名缺失</div><div class="value">${missingAttribution}</div></div><div class="field"><div class="label">下一核验动作</div><div class="value">${esc(missingBinding?'为已选图件补充真实正文目标绑定；当前不进入发布。':missingAttribution?'补充来源署名与权利上下文。':'逐张核对原图、页码和正文绑定。')}</div></div>`}
    function render(){renderList();renderMain();renderSummary();document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab))}
    $('projectSelect').addEventListener('change',e=>{window.ReviewPresentation?.setProjectIdInLocation?.(e.target.value);loadProject(e.target.value)});$('figureList').addEventListener('click',e=>{const b=e.target.closest('[data-idx]');if(!b)return;selected=Number(b.dataset.idx);tab='figure';history.replaceState(history.state,'',`${location.pathname}${location.search}#binding`);render()});$('main').addEventListener('click',event=>{if(event.target.id==='save-figure-target-binding')void saveTargetBinding()});document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.tab;history.replaceState(history.state,'',`${location.pathname}${location.search}${tab==='attribution'?'#license':''}`);render()}));loadProjects();
  </script>
</body>
</html>
